
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Grade Manager</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 16px;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #202938;
}

.container { max-width: 1000px; margin: auto; }
h1 { margin-bottom: 8px; }
.subtitle { color: #718096; margin-bottom: 28px; }

.panel {
  background: white;
  padding: 22px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 10px #0000000a;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.stat {
  background: #eef4ff;
  padding: 18px;
  border-radius: 10px;
}

.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 8px;
}

.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 12px;
}

input, select, button {
  padding: 11px;
  border: 1px solid #dce1e9;
  border-radius: 7px;
  font-size: 14px;
  min-width: 0;
}

button {
  cursor: pointer;
  background: #315ee8;
  color: white;
  border: none;
  font-weight: bold;
}

button:hover { opacity: .88; }
button:disabled { opacity: .5; cursor: not-allowed; }

.secondary { background: #64748b; }
.danger { background: #dc4848; }

.actions, .toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

table { width: 100%; border-collapse: collapse; }

th, td {
  padding: 13px 8px;
  text-align: center;
  border-bottom: 1px solid #edf0f4;
}

th { color: #64748b; font-size: 13px; }

.empty { color: #94a3b8; padding: 30px; }
.status { color: #64748b; font-size: 13px; margin-top: 12px; }
.file-name { font-weight: bold; color: #315ee8; }

@media(max-width:650px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: 1fr; }
  .table-wrap { overflow-x: auto; }
  table { min-width: 550px; }
}
</style>
</head>

<body>
<div class="container">

<h1>My Grade Manager</h1>
<p class="subtitle">나만의 성적 관리 프로그램</p>

<!-- 성적 요약 -->
<div class="panel">
  <h2>성적 요약</h2>
  <div class="stats">
    <div class="stat">
      전체 평점
      <strong id="totalGpa">0.00</strong>
    </div>
    <div class="stat">
      취득 학점
      <strong id="totalCredits">0</strong>
    </div>
    <div class="stat">
      등록 과목
      <strong id="courseCount">0</strong>
    </div>
  </div>
</div>

<!-- 과목 등록 -->
<div class="panel">
  <h2 id="formTitle">과목 등록</h2>

  <form id="courseForm">
    <div class="form-grid">
      <input id="name" placeholder="과목명" required maxlength="50">

      <select id="semester" required>
        <option value="">학기 선택</option>
        <option>1학년 1학기</option>
        <option>1학년 2학기</option>
        <option>2학년 1학기</option>
        <option>2학년 2학기</option>
        <option>3학년 1학기</option>
        <option>3학년 2학기</option>
        <option>4학년 1학기</option>
        <option>4학년 2학기</option>
      </select>

      <select id="credits" required>
        <option value="">학점</option>
        <option value="1">1학점</option>
        <option value="2">2학점</option>
        <option value="3">3학점</option>
        <option value="4">4학점</option>
        <option value="5">5학점</option>
        <option value="6">6학점</option>
      </select>

      <select id="grade" required>
        <option value="">성적</option>
        <option>A+ (4.5)</option>
        <option>A0 (4.0)</option>
        <option>B+ (3.5)</option>
        <option>B0 (3.0)</option>
        <option>C+ (2.5)</option>
        <option>C0 (2.0)</option>
        <option>D+ (1.5)</option>
        <option>D0 (1.0)</option>
        <option>F (0.0)</option>
      </select>
    </div>

    <div class="toolbar">
      <button type="submit" id="submitBtn">과목 추가</button>
      <button type="button" class="secondary" id="cancelBtn" hidden>
        수정 취소
      </button>
    </div>
  </form>
</div>

<!-- 과목 목록 -->
<div class="panel">
  <h2>과목 목록</h2>

  <select id="filter">
    <option value="all">전체 학기</option>
  </select>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>과목명</th>
          <th>학기</th>
          <th>학점</th>
          <th>성적</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="courseList"></tbody>
    </table>
  </div>

  <p class="status" id="semesterGpa">학기 평점: -</p>
</div>

<!-- 파일 저장 -->
<div class="panel">
  <h2>파일 저장 및 관리</h2>

  <p>
    연결된 파일:
    <span class="file-name" id="connectedFile">연결되지 않음</span>
  </p>

  <div class="actions">
    <button id="connectBtn">JSON 파일 연결 / 불러오기</button>
    <button id="saveBtn">JSON 파일 저장 / 덮어쓰기</button>
    <button id="disconnectBtn" class="secondary">연결 해제</button>
  </div>

  <p class="status" id="fileStatus">
    먼저 JSON 파일을 연결하거나 새 파일을 저장하세요.
  </p>
</div>

</div>

<script>
const gradePoints = {
  "A+ (4.5)": 4.5,
  "A0 (4.0)": 4.0,
  "B+ (3.5)": 3.5,
  "B0 (3.0)": 3.0,
  "C+ (2.5)": 2.5,
  "C0 (2.0)": 2.0,
  "D+ (1.5)": 1.5,
  "D0 (1.0)": 1.0,
  "F (0.0)": 0
};

const DB_NAME = "GradeManagerDB";
const STORE_NAME = "fileHandles";
const HANDLE_KEY = "gradeFile";

let courses = [];
let editingId = null;
let jsonFileHandle = null;

const $ = id => document.getElementById(id);


// ------------------------------
// IndexedDB: 파일 연결 정보 저장
// ------------------------------

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveHandle(handle) {
  const db = await openDB();

  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);

    tx.oncomplete = () => {
      db.close();
      resolve();
    };

    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
  });
}

async function getHandle() {
  const db = await openDB();

  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const request = tx.objectStore(STORE_NAME).get(HANDLE_KEY);

    request.onsuccess = () => {
      const result = request.result || null;
      db.close();
      resolve(result);
    };

    request.onerror = () => {
      db.close();
      reject(request.error);
    };
  });
}

async function removeHandle() {
  const db = await openDB();

  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).delete(HANDLE_KEY);

    tx.oncomplete = () => {
      db.close();
      resolve();
    };

    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
  });
}


// ------------------------------
// 데이터 검증 및 관리
// ------------------------------

function validateData(data) {
  if (!Array.isArray(data)) {
    throw new Error("올바른 데이터 파일이 아닙니다.");
  }

  return data.map(c => {
    if (
      typeof c.name !== "string" ||
      !c.name.trim() ||
      typeof c.semester !== "string" ||
      !c.semester.trim() ||
      !Number.isInteger(Number(c.credits)) ||
      Number(c.credits) < 1 ||
      Number(c.credits) > 6 ||
      !Object.hasOwn(gradePoints, c.grade)
    ) {
      throw new Error("잘못된 과목 정보가 포함되어 있습니다.");
    }

    return {
      id: String(c.id || crypto.randomUUID()),
      name: c.name.trim().slice(0, 50),
      semester: c.semester,
      credits: Number(c.credits),
      grade: c.grade
    };
  });
}

function saveLocal() {
  localStorage.setItem(
    "gradeManagerData",
    JSON.stringify(courses)
  );
}

function loadLocal() {
  try {
    const saved = localStorage.getItem("gradeManagerData");
    courses = saved ? validateData(JSON.parse(saved)) : [];
  } catch {
    courses = [];
  }
}

function calculateGpa(list) {
  const credits = list.reduce(
    (sum, c) => sum + c.credits, 0
  );

  const points = list.reduce(
    (sum, c) => sum + c.credits * gradePoints[c.grade], 0
  );

  return credits ? (points / credits).toFixed(2) : "0.00";
}


// ------------------------------
// 화면 출력
// ------------------------------

function render() {
  const totalCredits = courses
    .filter(c => c.grade !== "F (0.0)")
    .reduce((sum, c) => sum + c.credits, 0);

  $("totalGpa").textContent = calculateGpa(courses);
  $("totalCredits").textContent = totalCredits;
  $("courseCount").textContent = courses.length;

  const semesters = [...new Set(courses.map(c => c.semester))];
  const previousFilter = $("filter").value;

  $("filter").innerHTML =
    '<option value="all">전체 학기</option>' +
    semesters.map(s =>
      `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`
    ).join("");

  $("filter").value =
    semesters.includes(previousFilter) ? previousFilter : "all";

  const selected = $("filter").value;

  const visible = courses.filter(c =>
    selected === "all" || c.semester === selected
  );

  $("courseList").innerHTML = "";

  if (!visible.length) {
    $("courseList").innerHTML =
      '<tr><td colspan="5" class="empty">등록된 과목이 없습니다.</td></tr>';
  }

  visible.forEach(c => {
    const tr = document.createElement("tr");

    const name = document.createElement("td");
    name.textContent = c.name;

    const semester = document.createElement("td");
    semester.textContent = c.semester;

    const credits = document.createElement("td");
    credits.textContent = c.credits;

    const grade = document.createElement("td");
    grade.textContent = c.grade;

    const actions = document.createElement("td");

    const edit = document.createElement("button");
    edit.textContent = "수정";
    edit.onclick = () => editCourse(c.id);

    const del = document.createElement("button");
    del.textContent = "삭제";
    del.className = "danger";
    del.style.marginLeft = "5px";
    del.onclick = () => deleteCourse(c.id);

    actions.append(edit, del);
    tr.append(name, semester, credits, grade, actions);

    $("courseList").appendChild(tr);
  });

  const semesterCourses = courses.filter(c =>
    selected === "all" || c.semester === selected
  );

  $("semesterGpa").textContent =
    selected === "all"
      ? "전체 평점: " + calculateGpa(courses)
      : selected + " 평점: " + calculateGpa(semesterCourses);
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[ch]);
}

function updateFileName() {
  $("connectedFile").textContent =
    jsonFileHandle ? jsonFileHandle.name : "연결되지 않음";
}


// ------------------------------
// 과목 등록 및 수정
// ------------------------------

$("courseForm").addEventListener("submit", e => {
  e.preventDefault();

  const name = $("name").value.trim();
  const semester = $("semester").value;
  const credits = Number($("credits").value);
  const grade = $("grade").value;

  if (!name || !semester || !credits || !grade) {
    alert("모든 항목을 입력해 주세요.");
    return;
  }

  const duplicate = courses.some(c =>
    c.name === name &&
    c.semester === semester &&
    c.id !== editingId
  );

  if (
    duplicate &&
    !confirm("같은 학기에 같은 이름의 과목이 있습니다. 등록할까요?")
  ) {
    return;
  }

  if (editingId) {
    const target = courses.find(c => c.id === editingId);

    if (target) {
      Object.assign(target, { name, semester, credits, grade });
    }
  } else {
    courses.push({
      id: crypto.randomUUID(),
      name,
      semester,
      credits,
      grade
    });
  }

  resetForm();
  saveLocal();
  render();
});

function editCourse(id) {
  const c = courses.find(c => c.id === id);
  if (!c) return;

  editingId = id;

  $("name").value = c.name;
  $("semester").value = c.semester;
  $("credits").value = c.credits;
  $("grade").value = c.grade;

  $("formTitle").textContent = "과목 수정";
  $("submitBtn").textContent = "수정 완료";
  $("cancelBtn").hidden = false;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteCourse(id) {
  if (!confirm("이 과목을 삭제할까요?")) return;

  courses = courses.filter(c => c.id !== id);

  if (editingId === id) resetForm();

  saveLocal();
  render();
}

function resetForm() {
  editingId = null;
  $("courseForm").reset();

  $("formTitle").textContent = "과목 등록";
  $("submitBtn").textContent = "과목 추가";
  $("cancelBtn").hidden = true;
}

$("cancelBtn").onclick = resetForm;
$("filter").onchange = render;


// ------------------------------
// JSON 파일 연결 및 불러오기
// ------------------------------

async function readConnectedFile() {
  const file = await jsonFileHandle.getFile();
  const data = JSON.parse(await file.text());

  const imported = validateData(data.courses);

  courses = imported;
  saveLocal();
  render();
}

$("connectBtn").onclick = async () => {
  try {
    if (!window.showOpenFilePicker) {
      throw new Error(
        "현재 브라우저에서는 파일 연결 기능을 지원하지 않습니다. 크롬 또는 엣지를 사용해 주세요."
      );
    }

    const [handle] = await window.showOpenFilePicker({
      types: [{
        description: "JSON 파일",
        accept: { "application/json": [".json"] }
      }],
      multiple: false
    });

    jsonFileHandle = handle;

    await readConnectedFile();
    await saveHandle(jsonFileHandle);

    updateFileName();

    $("fileStatus").textContent =
      "파일 연결 및 데이터 불러오기가 완료되었습니다.";

  } catch (error) {
    if (error.name !== "AbortError") {
      alert("파일 연결 실패: " + error.message);
    }
  }
};


// ------------------------------
// JSON 파일 저장 및 덮어쓰기
// ------------------------------

$("saveBtn").onclick = async () => {
  try {
    if (!window.showSaveFilePicker) {
      throw new Error(
        "현재 브라우저에서는 파일 저장 기능을 지원하지 않습니다. 크롬 또는 엣지를 사용해 주세요."
      );
    }

    if (!jsonFileHandle) {
      jsonFileHandle = await window.showSaveFilePicker({
        suggestedName: "my_grades.json",
        types: [{
          description: "JSON 파일",
          accept: { "application/json": [".json"] }
        }]
      });

      await saveHandle(jsonFileHandle);
      updateFileName();
    }

    let permission = await jsonFileHandle.queryPermission({
      mode: "readwrite"
    });

    if (permission !== "granted") {
      permission = await jsonFileHandle.requestPermission({
        mode: "readwrite"
      });
    }

    if (permission !== "granted") {
      throw new Error("파일 쓰기 권한이 허용되지 않았습니다.");
    }

    const writable = await jsonFileHandle.createWritable();

    await writable.write(
      JSON.stringify({
        version: 1,
        courses: courses
      }, null, 2)
    );

    await writable.close();

    $("fileStatus").textContent =
      "기존 JSON 파일에 정상적으로 덮어썼습니다.";

  } catch (error) {
    if (error.name !== "AbortError") {
      alert("저장 실패: " + error.message);
    }
  }
};


// ------------------------------
// 파일 연결 해제
// ------------------------------

$("disconnectBtn").onclick = async () => {
  if (!confirm("저장된 파일 연결 정보를 삭제할까요?")) return;

  jsonFileHandle = null;

  await removeHandle();
  updateFileName();

  $("fileStatus").textContent =
    "파일 연결이 해제되었습니다. 성적 데이터는 유지됩니다.";
};


// ------------------------------
// 프로그램 재실행 시 파일 연결 복원
// ------------------------------

async function restoreFileConnection() {
  try {
    jsonFileHandle = await getHandle();

    if (!jsonFileHandle) {
      $("fileStatus").textContent =
        "연결된 파일이 없습니다. JSON 파일을 연결해 주세요.";
      return;
    }

    updateFileName();

    const permission = await jsonFileHandle.queryPermission({
      mode: "readwrite"
    });

    if (permission === "granted") {
      await readConnectedFile();

      $("fileStatus").textContent =
        "기존 JSON 파일에서 데이터를 자동으로 불러왔습니다.";
    } else {
      $("fileStatus").textContent =
        "파일 연결 정보는 복원했습니다. 저장 버튼을 눌러 권한을 확인하거나 파일을 다시 연결해 주세요.";
    }

  } catch (error) {
    $("fileStatus").textContent =
      "파일 연결 정보를 복원하지 못했습니다. 파일을 다시 연결해 주세요.";
  }
}


// ------------------------------
// 시작
// ------------------------------

loadLocal();
render();
restoreFileConnection();

</script>
</body>
</html>
